  #app{
    max-width:960px;margin:0 auto; position:relative; z-index:1; width:100%;
    flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;
  }
  #app > header{ flex:0 0 auto; }
  #app > main{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #app > div{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  footer{ flex:0 0 auto; }

  /* Tablets im Hochformat / kleine Desktop-Fenster */
  @media (min-width: 700px){
    #app{max-width:1100px;}
  }

  /* Fire HD 10 & ähnliche Tablets im HOCHFORMAT: exakt 3 Spalten, große Touch-Ziele.
     An orientation:portrait gekoppelt statt an eine feste Pixel-Obergrenze, weil
     manche Kiosk-Browser (z. B. Fully Kiosk) die Viewport-Breite ungewöhnlich
     melden und eine feste max-width-Grenze dadurch verfehlt werden kann. */
  @media (min-width: 700px) and (orientation: portrait){
    .member-grid{ grid-template-columns:repeat(3, 1fr); gap:16px; }
    .member-chip{ padding:24px 18px; min-height:104px; }
    .member-chip .name{ font-size:22px; margin-bottom:8px; }
    .member-chip .balance{ font-size:17.5px; }
    .product-grid{ grid-template-columns:repeat(3, 1fr); gap:14px; }
    .product-btn{ padding:24px 14px; min-height:108px; }
    .product-btn .pname{ font-size:21px; }
    .product-btn .pprice{ font-size:17.5px; }
    .cat-label{ font-size:14px; }
    button.btn{ font-size:17px; padding:15px 20px; min-height:54px; }
    .search-input{ font-size:18px; min-height:54px; }
  }

  /* Große Tablets (z. B. Fire HD 10 quer) & Desktop */
  @media (min-width: 1100px) and (orientation: landscape){
    #app{max-width:1500px;}
    main{padding:28px 36px;}
    .member-grid{ grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:16px; }
    .product-grid{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px; }
    .member-chip{ padding:22px 18px; min-height:98px; }
    .member-chip .name{ font-size:21px; }
    .member-chip .balance{ font-size:17px; }
    .product-btn{ padding:22px 14px; min-height:100px; }
    .product-btn .pname{ font-size:20px; }
    .product-btn .pprice{ font-size:17px; }
    button.btn{ padding:14px 20px; font-size:16px; }
    nav.tabs button{ font-size:20px; padding:14px 20px 16px; }
  }

  /* Kiosk-Feel: kein versehentliches Markieren/Callout beim Antippen */
  button, .member-chip, .product-btn, nav.tabs, .icon-btn{
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  html{ -webkit-tap-highlight-color: transparent; overscroll-behavior:none; }

  .display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* HEADER */
  header.top{
    background: var(--court);
    color: var(--chalk);
    padding: 22px 20px 0;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .brand-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .logo-badge{
    background: var(--chalk);
    border-radius: 12px;
    padding: 6px 10px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  .club-logo{
    height:44px; width:auto; flex:0 0 auto; display:block;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .logo-badge .club-logo{
    height:72px;
    filter:none;
  }
  .brand-name{
    font-family:'Bebas Neue', sans-serif; font-size:29px; line-height:1.05; flex:1;
    letter-spacing:0.03em; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 9px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  }
  .brand-name .main{ color: var(--chalk); }
  .brand-name .accent{ color: var(--ball); }
  .subtitle{font-size:13px; color: rgba(247,245,239,0.65); margin:-6px 0 16px; letter-spacing:0.02em;}

  nav.tabs{ display:flex; gap:2px; overflow-x:auto; }
  nav.tabs button{
    background:none; border:none; color: rgba(247,245,239,0.6);
    font-family:'Bebas Neue', sans-serif; font-size:19px; letter-spacing:0.03em;
    padding:13px 16px 15px; min-height:48px; cursor:pointer; white-space:nowrap;
    border-bottom: 3px solid transparent;
  }
  nav.tabs button.active{ color: var(--ball); border-bottom-color: var(--ball); }
  nav.tabs button:hover:not(.active){ color: var(--chalk); }

  main{padding:20px; box-sizing:border-box;}

  /* CARDS / GENERIC */
  .card{
    background:#fff; border:1px solid var(--line); border-radius: var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .section-title{
    font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:0.02em;
    margin:0 0 12px; color: var(--court);
  }
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  input[type=text], input[type=number], select{
    font-family:'Inter', sans-serif; font-size:16px;
    padding:12px 14px; min-height:46px; border:1px solid var(--line); border-radius:8px;
    background:#fff; color:var(--ink); outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus{ border-color: var(--court-light); }
  button.btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:15px;
    padding:12px 18px; min-height:46px; border-radius:8px; border:1px solid var(--court);
    background: var(--court); color:#fff; cursor:pointer;
  }
  button.btn:hover{ background: var(--court-light); }
  button.btn.ghost{ background:transparent; color:var(--court); }
  button.btn.ghost:hover{ background: rgba(27,67,50,0.06); }
  button.btn.danger{ background:#fff; color:var(--danger); border-color:var(--danger); }
  button.btn.danger:hover{ background: rgba(193,68,46,0.08); }
  button.btn.accent{ background: var(--ball); color: var(--ink); border-color: var(--ball); }
  button.btn.accent:hover{ filter:brightness(0.95); }
  button.btn:disabled{ opacity:0.4; cursor:not-allowed; }
  button.icon-btn{
    background:none; border:none; cursor:pointer; color:var(--muted); font-size:20px;
    padding:8px; min-width:40px; min-height:40px; display:inline-flex; align-items:center; justify-content:center;
  }
  button.icon-btn:hover{ color:var(--danger); }

  /* TALLY signature element */
  .tally{ display:inline-flex; gap:3px; align-items:flex-end; }
  .tally-group{ display:inline-flex; position:relative; width:16px; height:16px; margin-right:3px; }
  .tally-group span{
    position:absolute; bottom:0; width:2px; height:14px; background: var(--court-light); border-radius:1px;
  }
  .tally-group span:nth-child(1){ left:0px; }
  .tally-group span:nth-child(2){ left:4px; }
  .tally-group span:nth-child(3){ left:8px; }
  .tally-group span:nth-child(4){ left:12px; }
  .tally-group span:nth-child(5){
    width:18px; height:2px; top:6px; left:-1px; transform:rotate(-35deg); background:var(--clay);
  }

  /* THEKE VIEW */
  .member-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap:14px; }
  .member-chip{
    border:1px solid var(--line); border-radius:12px; padding:20px 16px; background:#fff;
    cursor:pointer; text-align:left; transition: border-color .1s, transform .05s; min-height:86px;
  }
  .member-chip:hover{ border-color: var(--court-light); }
  .member-chip.selected{ border-color: var(--court); box-shadow: 0 0 0 2px var(--court) inset; }
  .member-chip .name{ font-weight:600; font-size:19px; line-height:1.25; margin-bottom:7px; }
  .member-chip .balance{ font-family:'JetBrains Mono', monospace; font-size:16px; }
  .balance.pos{ color: var(--danger); }
  .balance.zero{ color: var(--muted); }
  .balance.neg{ color: #2D6A4F; }

  .search-input{ width:100%; padding:13px 14px; min-height:46px; margin-bottom:14px; }

  .cat-label{
    font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);
    margin:18px 0 10px; font-weight:700;
  }
  .cat-label:first-child{ margin-top:0; }
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(165px,1fr)); gap:12px; }
  .product-btn{
    border:1px solid var(--line); border-radius:12px; background:#fff; padding:20px 12px;
    cursor:pointer; text-align:center; min-height:92px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .product-btn:hover{ border-color:var(--ball); background: rgba(245,205,75,0.18); }
  .product-btn .pname{ font-size:19px; font-weight:600; display:block; line-height:1.2; }
  .product-btn .pprice{ font-family:'JetBrains Mono', monospace; font-size:16px; color:var(--muted); display:block; }

  .cart{ margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
  .cart-row{ display:flex; justify-content:space-between; align-items:center; font-size:17px; padding:9px 0; }
  .cart-row .qty-controls{ display:flex; align-items:center; gap:10px; }
  .qty-controls button{
    width:42px; height:42px; font-size:20px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer;
  }
  .cart-total{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:20px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }

  /* TABLES */
  table{ width:100%; border-collapse:collapse; font-size:15px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); padding:9px 10px; border-bottom:1px solid var(--line); }
  td{ padding:13px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'JetBrains Mono', monospace; text-align:right; }

  .summary-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .summary-cards .card{ margin-bottom:0; text-align:center; }
  .summary-cards .big{ font-family:'Bebas Neue', sans-serif; font-size:32px; color:var(--court); }
  .summary-cards .lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }

  .empty{ text-align:center; padding:30px 10px; color:var(--muted); }
  .empty .display{ font-size:22px; color:var(--court); display:block; margin-bottom:6px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(22,36,29,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  .modal{ background:#fff; border-radius:var(--radius); padding:24px; width:100%; max-width:400px; }
  .modal h3{ font-family:'Bebas Neue', sans-serif; font-size:22px; margin:0 0 14px; color:var(--court); }
  .modal .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .modal .field label{ font-size:13px; color:var(--muted); }
  .modal .field input, .modal .field select{ width:100%; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  /* Bestell-Overlay (Theke): großflächig statt Inline-Karte, Buchen-Leiste bleibt fest sichtbar */
  .order-sheet{
    background:#fff; border-radius:var(--radius); width:100%; max-width:760px;
    max-height:92vh; max-height:92dvh; display:flex; flex-direction:column; overflow:hidden;
  }
  .order-sheet-header{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:18px 20px; border-bottom:1px solid var(--line);
  }
  .order-sheet-body{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 20px; }
  .order-sheet-footer{
    flex:0 0 auto; padding:14px 20px 18px; border-top:1px solid var(--line);
    box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
  }
  @media (min-width:1100px){
    .order-sheet{ max-width:900px; }
  }

  /* Barcode-/Kamera-Scanner */
  .scan-btn{
    flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    width:46px; height:46px; border-radius:8px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:20px;
  }
  .scan-btn:hover{ border-color: var(--court-light); }
  .scanner-video{
    width:100%; border-radius:10px; background:#000; display:block; max-height:60vh; object-fit:cover;
  }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:8px; font-size:14.5px; z-index:60;
    opacity:0; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .loading{ text-align:center; padding:60px 10px; color:var(--muted); font-family:'Bebas Neue',sans-serif; font-size:18px;}

  @media (max-width:520px){
    .brand-name{ font-size:23px; }
    .logo-badge{ padding:4px 7px; border-radius:9px; }
    .logo-badge .club-logo{ height:52px; }
    .summary-cards{ grid-template-columns:1fr 1fr; }
    main{ padding:14px; }
    .card{ padding:14px; }
    nav.tabs button{ font-size:16px; padding:11px 12px 13px; }
    button.btn{ padding:12px 14px; font-size:14.5px; }
    .modal{ padding:18px; max-width:100%; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Lade Tresen …</div></div>
<footer id="appFooter" style="position:relative; z-index:1; text-align:center; padding:18px 10px 26px; font-size:11.5px; color:var(--muted); font-family:'Inter', sans-serif;">
  Erstellt von Marco Weber für SG Germania Binsfeld Tennis
</footer>

<script>
(function(){
  "use strict";

  // Bei jedem neuen Release hier aktualisieren (erscheint automatisch im Footer).
  const APP_VERSION = 'v1.20.0';
  document.getElementById('appFooter').textContent =
    'Erstellt von Marco Weber für SG Germania Binsfeld Tennis · ' + APP_VERSION;

  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  const fmt = (n) => (Math.round(n*100)/100).toFixed(2).replace('.', ',') + ' €';
  const fullName = (m) => [m.firstName, m.lastName].filter(Boolean).join(' ').trim() || m.name || '';

  let state = {
    loaded: false,
    settings: {
      clubName: 'SG Germania Binsfeld Tennis',
      requireBarcodeForBookings: false,
      // Modulverwaltung: einzelne Funktionen lassen sich hierüber global
      // ein-/ausschalten. Neue Funktionen bekommen hier künftig einen
      // eigenen Schalter dazu - nur für den Ersteller sichtbar/bedienbar.
      modules: {
        barcodeScanning: true,
        negativePayments: true,
        verlaufFilter: true,
        verlaufSummary: true,
        fullscreenButton: true,
      },
    },
    members: [],
    products: [],
    // Salden je Mitglied (memberId -> Zahl), kommen fertig aggregiert vom
    // Server (SQL-Summe) statt aus der kompletten Buchungshistorie im Browser
    // berechnet zu werden. Die Historie selbst wird nur noch bei Bedarf
    // (Verlauf-Tab) seitenweise nachgeladen, nicht mehr komplett gehalten.
    balances: {},
    // Enthält NIE die PIN-Werte selbst - nur ob PINs eingerichtet sind und ob
    // schon ein Ersteller-PIN existiert. Die eigentliche Prüfung läuft immer
    // über den Server (verifyPin), nie clientseitig.
    authStatus: { hasAuth: false, hasOwnerPin: false },
    // Der PIN, mit dem sich diese Sitzung zuletzt erfolgreich als Admin/
    // Ersteller angemeldet hat - nur im Speicher dieser Sitzung, wird für
    // "PINs ändern" als Bestätigung mitgeschickt, damit nicht doppelt nach
    // einem PIN gefragt werden muss. Wird bei "Abmelden" gelöscht.
    verifiedPin: null,
    thekeUnlocked: false,
    adminUnlocked: false,
    ownerUnlocked: false,
    view: 'theke',
    selectedMember: null,
    cart: {}, // productId -> qty
    memberSearch: '',
    verlaufFilter: { memberId: '', type: '', from: '', to: '' },
    // Zwischengespeicherte, seitenweise geladene Verlaufs-Einträge für den
    // aktuellen Filter - wird ungültig (und neu geladen), sobald sich der
    // Filter ändert oder eine neue Buchung/Löschung stattfand.
    verlaufData: { filterKey: null, attemptedKey: null, items: [], total: 0, offset: 0, loading: false, summary: { orderSum: 0, paymentSum: 0, correctionSum: 0 } },
  };

  const ADMIN_VIEWS = ['uebersicht','mitglieder','produkte'];

  async function loadAll(){
    try {
      // Einmalige, sich selbst erledigende Migration alter Installationen
      // (Buchungshistorie als ein einzelner JSON-Block) auf die neue Tabelle -
      // no-op, falls schon migriert oder eine neue Installation.
      await apiAction({ action: 'migrate_transactions' });
      const [s, m, p, authStatus, balancesRes] = await Promise.all([
        safeGet('settings'), safeGet('members'), safeGet('products'), fetchAuthStatus(), apiAction({ action:'get_balances' })
      ]);
      if (s) {
        const loadedSettings = JSON.parse(s.value);
        // Bestehende Installationen hatten "modules" noch nicht - fehlende
        // Schalter mit den Standardwerten auffüllen, statt sie zu verlieren.
        state.settings = {
          ...state.settings,
          ...loadedSettings,
          modules: { ...state.settings.modules, ...(loadedSettings.modules || {}) },
        };
      }
      if (m) state.members = JSON.parse(m.value);
      // Migration: ältere Mitgliederdatensätze hatten nur ein "name"-Feld statt
      // getrennter Vor-/Nachnamen - einmalig aufsplitten, letztes Wort = Nachname.
      state.members.forEach(mem=>{
        if(!mem.firstName && !mem.lastName && mem.name){
          const parts = mem.name.trim().split(/\s+/);
          mem.lastName = parts.length > 1 ? parts.pop() : '';
          mem.firstName = parts.join(' ');
        }
        if(mem.firstName === undefined) mem.firstName = '';
        if(mem.lastName === undefined) mem.lastName = '';
      });
      if (p) state.products = JSON.parse(p.value);
      if (authStatus) state.authStatus = authStatus;
      if (balancesRes.ok && balancesRes.data) state.balances = balancesRes.data.balances || {};
    } catch(e){ console.error('Ladefehler', e); }
    state.loaded = true;
    render();
  }

  // ---- Auth: läuft ausschließlich über den Server. Die drei PIN-Werte
  // selbst verlassen die Datenbank nie - weder beim Laden noch bei der Prüfung. ----
  async function authAction(payload){
    try {
      const res = await fetch('api.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(()=>null);
      return { ok: res.ok, status: res.status, data };
    } catch(e){
      console.error(e);
      return { ok:false, status:0, data:null };
    }
  }
  // Gleiche Funktion, nur unter einem allgemeineren Namen für Aufrufe, die
  // nichts mit PINs zu tun haben (Buchungen, Migration, Salden).
  const apiAction = authAction;
  async function fetchAuthStatus(){
    const r = await authAction({ action: 'auth_status' });
    return r.ok ? r.data : null;
  }
  // Prüft einen PIN serverseitig. Gibt 'theke' | 'admin' | 'owner' | null zurück.
  async function verifyPin(pin){
    const r = await authAction({ action: 'verify_pin', pin });
    return r.ok && r.data ? r.data.level : null;
  }

  async function safeGet(key){
    try {
      const res = await fetch('api.php?key=' + encodeURIComponent(key));
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json(); // {key, value}
    } catch(e){ console.error(e); return null; }
  }
  async function saveKey(key, value){
    try {
      const res = await fetch('api.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ action:'set', key, value: JSON.stringify(value) })
      });
      if(!res.ok){ toast('Speichern fehlgeschlagen – bitte erneut versuchen.'); return null; }
      return await res.json();
    } catch(e){ console.error(e); toast('Speicherfehler: ' + e.message); return null; }
  }

  function saveMembers(){ return saveKey('members', state.members); }
  function saveProducts(){ return saveKey('products', state.products); }
  function saveSettings(){ return saveKey('settings', state.settings); }

  function balanceOf(memberId){
    return state.balances[memberId] || 0;
  }

  // Bucht eine einzelne Buchung (Bestellung oder Zahlung/Korrektur) und
  // aktualisiert den betroffenen Saldo direkt lokal, ohne die komplette
  // Salden-Liste neu vom Server zu laden.
  async function addTransaction(tx){
    const r = await apiAction({ action: 'add_transaction', transaction: tx });
    if(!r.ok) return false;
    const delta = tx.type === 'order' ? tx.total : -tx.amount;
    state.balances[tx.memberId] = (state.balances[tx.memberId] || 0) + delta;
    state.verlaufData.filterKey = null;
    state.verlaufData.attemptedKey = null; // beide Sperren zurücksetzen, sonst hält sich der Verlauf innerhalb der Sitzung fälschlich für aktuell
    return true;
  }

  function toast(msg){
    let el = document.getElementById('toast');
    if(!el){
      el = document.createElement('div'); el.id='toast'; el.className='toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(()=> el.classList.remove('show'), 2400);
  }

  // Generischer Kamera-Scanner (QR- & 1D-Barcodes) via ZXing. onResult(text)
  // wird einmalig mit dem erkannten Code aufgerufen, danach schließt sich der
  // Scanner automatisch.
  function openBarcodeScanner(onResult){
    if(typeof ZXing === 'undefined'){
      toast('Scanner nicht verfügbar (kein Internet beim Laden der Seite?).');
      return;
    }
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h3>📷 Barcode scannen</h3>
        <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
          Karte oder Code vor die Kamera halten.
        </div>
        <video class="scanner-video" autoplay muted playsinline></video>
        <div class="scanner-error" style="color:var(--danger); font-size:12.5px; min-height:16px; margin-top:8px;"></div>
        <div class="modal-actions">
          <button class="btn ghost" data-act="cancel">Abbrechen</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const videoEl = backdrop.querySelector('video');
    const errEl = backdrop.querySelector('.scanner-error');
    const reader = new ZXing.BrowserMultiFormatReader();
    let done = false;

    function cleanup(){
      done = true;
      try{ reader.reset(); }catch(e){}
      backdrop.remove();
    }
    backdrop.querySelector('[data-act="cancel"]').addEventListener('click', cleanup);
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) cleanup(); });

    reader.decodeFromVideoDevice(undefined, videoEl, (result, err)=>{
      if(done) return;
      if(result){
        const text = result.getText();
        cleanup();
        onResult(text);
      }
      // "NotFoundException" wird bei jedem Frame ohne erkannten Code geworfen -
      // das ist normal und wird bewusst ignoriert, kein echter Fehler.
    }).catch(err=>{
      errEl.textContent = 'Kamera konnte nicht gestartet werden: ' + (err && err.message ? err.message : 'Zugriff verweigert.');
    });
  }

  function el(html){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tallyIcon(count){
    const groups = Math.ceil(count/5) || 0;
    let html = '<span class="tally">';
    let remaining = count;
    for(let g=0; g<groups; g++){
      const n = Math.min(5, remaining);
      remaining -= n;
      let bars = '';
      for(let i=0;i<n;i++) bars += '<span></span>';
      html += '<span class="tally-group">'+bars+'</span>';
    }
    html += '</span>';
    return html;
  }

  // ---------- RENDER ----------
  function render(){
    const app = document.getElementById('app');
    if(!state.loaded){ app.innerHTML = '<div class="loading">Lade Tresen …</div>'; return; }

    // Scroll-Position des Inhaltsbereichs merken, damit z. B. beim Bestellen
    // an der Theke nicht nach jedem Tippen wieder nach oben gesprungen wird.
    const prevScroller = app.querySelector('main, #app > div');
    const prevScrollTop = prevScroller ? prevScroller.scrollTop : 0;

    app.innerHTML = '';
    if(!state.authStatus.hasAuth){ app.appendChild(renderSetupScreen()); return; }
    if(!state.thekeUnlocked){ app.appendChild(renderLockScreen()); return; }
    app.appendChild(renderHeader());
    const main = document.createElement('main');
    main.appendChild(renderView());
    app.appendChild(main);
    main.scrollTop = prevScrollTop;
  }

  function renderSetupScreen(){
    const wrap = el(`
      <div style="max-width:380px; margin:60px auto; padding:0 16px;">
        <div class="card">
          <div class="section-title">Zugriffsschutz einrichten</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:14px;">
            Einmalige Ersteinrichtung für euren Tresen. Legt zwei PINs fest:
            das <strong>Theke-PIN</strong> für alle, die buchen, und das
            <strong>Admin-PIN</strong> für Verwaltung &amp; Zahlungen (z. B. Vorstand/Kasse).
          </div>
          <div class="field">
            <label>Theke-PIN</label>
            <input type="text" id="setupTheke" placeholder="z. B. 4 Ziffern" />
          </div>
          <div class="field">
            <label>Admin-PIN</label>
            <input type="text" id="setupAdmin" placeholder="anderer Code als Theke-PIN" />
          </div>
          <div id="setupError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <button class="btn accent" id="setupBtn" style="width:100%;">Einrichten</button>
        </div>
      </div>
    `);
    wrap.querySelector('#setupBtn').addEventListener('click', async ()=>{
      const tp = wrap.querySelector('#setupTheke').value.trim();
      const ap = wrap.querySelector('#setupAdmin').value.trim();
      const err = wrap.querySelector('#setupError');
      if(!tp || !ap){ err.textContent = 'Bitte beide PINs ausfüllen.'; return; }
      if(tp === ap){ err.textContent = 'Theke-PIN und Admin-PIN sollten unterschiedlich sein.'; return; }
      const r = await authAction({ action:'set_auth', thekePin: tp, adminPin: ap });
      if(!r.ok){ err.textContent = 'Speichern fehlgeschlagen, bitte erneut versuchen.'; return; }
      state.authStatus = { hasAuth: true, hasOwnerPin: false };
      state.verifiedPin = ap;
      state.thekeUnlocked = true;
      state.adminUnlocked = true;
      toast('Zugriffsschutz eingerichtet');
      render();
    });
    return wrap;
  }

          <div class="section-title" style="text-align:center;">${escapeHtml(state.settings.clubName)}</div>

    const lockBtn = wrap.querySelector('#lockBtn');
    const doUnlock = async ()=>{
      const pin = input.value.trim();
      const err = wrap.querySelector('#lockError');
      if(!pin) return;
      lockBtn.disabled = true;
      const level = await verifyPin(pin);
      lockBtn.disabled = false;
      if(level === 'admin' || level === 'owner'){
        state.verifiedPin = pin;
        state.thekeUnlocked = true; state.adminUnlocked = true;
        state.ownerUnlocked = (level === 'owner');
        render(); return;
      }
      if(level === 'theke'){
        state.thekeUnlocked = true; render(); return;
      }
      err.textContent = 'Falscher PIN.';
      input.value=''; input.focus();
    };
    wrap.querySelector('#lockBtn').addEventListener('click', doUnlock);
    wrap.querySelector('#lockScanBtn')?.addEventListener('click', ()=>{
      openBarcodeScanner((code)=>{ input.value = code; doUnlock(); });
    });
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') doUnlock(); });
    setTimeout(()=>input.focus(), 50);
    return wrap;

  function openAdminPinModal(onUnlocked){
    const backdrop = el(`
      <div class="modal-backdrop">
        <div class="modal">
          <h3>🔒 Admin-Bereich</h3>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
            Für diesen Bereich ist das Admin-PIN nötig.
          </div>
          <div class="field">
            <input type="password" id="adminPinInput" inputmode="numeric" placeholder="Admin-PIN" />
          </div>
          <div id="adminPinError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="adminPinCancel">Abbrechen</button>
            <button class="btn" id="adminPinConfirm">Entsperren</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector('#adminPinInput');
    const confirmBtn = backdrop.querySelector('#adminPinConfirm');
    backdrop.querySelector('#adminPinCancel').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    const confirmPin = async ()=>{
      const pin = input.value.trim();
      if(!pin) return;
      confirmBtn.disabled = true;
      const level = await verifyPin(pin);
      confirmBtn.disabled = false;
      if(level === 'admin' || level === 'owner'){
        state.adminUnlocked = true;
        state.ownerUnlocked = state.ownerUnlocked || (level === 'owner');
        state.verifiedPin = pin;
        backdrop.remove();
        onUnlocked();
      } else {
        backdrop.querySelector('#adminPinError').textContent = 'Falscher PIN.';
        input.value=''; input.focus();
      }
    };
    backdrop.querySelector('#adminPinConfirm').addEventListener('click', confirmPin);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmPin(); });

  function tabBtn(view, label){
    const showLock = ADMIN_VIEWS.includes(view) && !state.adminUnlocked;
    return `<button data-view="${view}" class="${state.view===view?'active':''}">${showLock?'🔒 ':''}${label}</button>`;
  }

  function renderView(){
    switch(state.view){
      case 'theke': return renderTheke();
      case 'uebersicht': return renderUebersicht();
      case 'mitglieder': return renderMitglieder();
      case 'produkte': return renderProdukte();
      case 'verlauf': return renderVerlauf();
      case 'module': return state.ownerUnlocked ? renderModule() : renderTheke();
      default: return document.createElement('div');
    }
  }

  // ---------- THEKE ----------
  function renderTheke(){
    const wrap = document.createElement('div');

    if(state.members.length === 0){
      wrap.appendChild(el(`
        <div class="card empty">
          <span class="display">Noch keine Mitglieder</span>
          Lege zuerst Mitglieder unter „Mitglieder" an, um an der Theke buchen zu können.
        </div>
      `));
      return wrap;
    }

    const card = el(`<div class="card"></div>`);
    const searchRow = el(`<div class="row" style="align-items:stretch; margin-bottom:14px;"></div>`);
    const search = el(`<input class="search-input" type="text" placeholder="Mitglied suchen …" style="flex:1; margin-bottom:0;" />`);
    search.value = state.memberSearch;
    search.addEventListener('input', ()=>{ state.memberSearch = search.value; renderMemberGrid(grid); });
    searchRow.appendChild(search);
    if(state.settings.modules.barcodeScanning){
      const scanBtn = el(`<button class="scan-btn" title="Mitglied per Barcode auswählen">📷</button>`);
      scanBtn.addEventListener('click', ()=>{
        openBarcodeScanner((code)=>{
          const match = state.members.find(m => m.active !== false && m.barcode && m.barcode === code);
          if(match){ openOrderOverlay(match); }
          else { toast('Kein aktives Mitglied mit diesem Barcode gefunden.'); }
        });
      });
      searchRow.appendChild(scanBtn);
    }
    card.appendChild(searchRow);
    const grid = el(`<div class="member-grid"></div>`);
    card.appendChild(grid);
    wrap.appendChild(card);
    renderMemberGrid(grid);
    return wrap;
  }

  function renderMemberGrid(grid){
    grid.innerHTML = '';
    const q = state.memberSearch.trim().toLowerCase();
    const list = state.members
      .filter(m=>m.active !== false)
      .filter(m=> !q || fullName(m).toLowerCase().includes(q));
    if(list.length===0){
      grid.appendChild(el(`<div class="empty" style="grid-column:1/-1;">Keine Treffer.</div>`));
      return;
    }
    for(const m of list){
      const bal = balanceOf(m.id);
      const cls = bal > 0.001 ? 'pos' : (bal < -0.001 ? 'neg' : 'zero');
      const barcodeRequired = state.settings.requireBarcodeForBookings && !!m.barcode;
      const chip = el(`
        <button class="member-chip">
          <div class="name">${barcodeRequired ? '📷 ' : ''}${escapeHtml(fullName(m))}</div>
          <div class="balance ${cls}">${fmt(bal)}</div>
        </button>
      `);
      chip.addEventListener('click', ()=>{
        if(barcodeRequired){
          toast('Bitte den Barcode von ' + fullName(m) + ' scannen, um eine Bestellung durchzuführen.');
          return;
        }
        openOrderOverlay(m);
      });
      grid.appendChild(chip);
    }
  }

  // Bestellung als großflächiges Overlay statt Inline-Karte - nutzt den
  // Bildschirm besser aus und die Buchen-Leiste bleibt immer sichtbar.
  function openOrderOverlay(member){
    state.selectedMember = member.id;
    state.cart = {};

    const backdrop = el(`<div class="modal-backdrop"></div>`);
    const sheet = el(`
      <div class="order-sheet">
        <div class="order-sheet-header">
          <div class="section-title" style="margin:0;">Bestellung für ${escapeHtml(fullName(member))}</div>
          <button class="icon-btn" id="closeOrderSheet" title="Schließen">✕</button>
        </div>
        <div class="order-sheet-body"></div>
        <div class="order-sheet-footer"></div>
      </div>
    `);
    backdrop.appendChild(sheet);
    document.body.appendChild(backdrop);

    const body = sheet.querySelector('.order-sheet-body');
    const footer = sheet.querySelector('.order-sheet-footer');

    function closeOverlay(){
      state.selectedMember = null;
      state.cart = {};
      backdrop.remove();
      render();
    }
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeOverlay(); });
    sheet.querySelector('#closeOrderSheet').addEventListener('click', closeOverlay);

    function renderBody(){
      body.innerHTML = '';
      const activeProducts = state.products.filter(p=>p.active !== false);
      if(activeProducts.length === 0){
        body.appendChild(el(`<div class="empty">Noch keine Produkte angelegt. Lege welche unter „Produkte" an.</div>`));
        return;
      }
      const cats = [...new Set(activeProducts.map(p=>p.category || 'Sonstiges'))];
      for(const cat of cats){
        body.appendChild(el(`<div class="cat-label">${escapeHtml(cat)}</div>`));
        const pg = el(`<div class="product-grid"></div>`);
        activeProducts.filter(p=>(p.category||'Sonstiges')===cat).forEach(p=>{
          const btn = el(`
            <button class="product-btn">
              <span class="pname">${escapeHtml(p.name)}</span>
              <span class="pprice">${fmt(p.price)}</span>
            </button>
          `);
          btn.addEventListener('click', ()=>{
            state.cart[p.id] = (state.cart[p.id]||0) + 1;
            renderFooter();
          });
          pg.appendChild(btn);
        });
        body.appendChild(pg);
      }
    }

    function renderFooter(){
      footer.innerHTML = '';
      const cartKeys = Object.keys(state.cart).filter(k=>state.cart[k]>0);
      if(cartKeys.length === 0){
        footer.appendChild(el(`<div style="color:var(--muted); font-size:13px;">Noch nichts ausgewählt.</div>`));
        return;
      }
      const cartDiv = el(`<div class="cart" style="margin-top:0; padding-top:0; border-top:none;"></div>`);
      let total = 0;
      for(const pid of cartKeys){
        const p = state.products.find(pp=>pp.id===pid);
        if(!p) continue;
        const qty = state.cart[pid];
        total += p.price * qty;
        const row = el(`
          <div class="cart-row">
            <span>${escapeHtml(p.name)}</span>
            <div class="qty-controls">
              <button data-act="dec">–</button>
              <span class="mono">${qty}</span>
              <button data-act="inc">+</button>
              <span class="mono" style="width:60px; text-align:right;">${fmt(p.price*qty)}</span>
            </div>
          </div>
        `);
        row.querySelector('[data-act="dec"]').addEventListener('click', ()=>{
          state.cart[pid] = Math.max(0, state.cart[pid]-1);
          renderFooter();
        });
        row.querySelector('[data-act="inc"]').addEventListener('click', ()=>{
          state.cart[pid] += 1;
          renderFooter();
        });
        cartDiv.appendChild(row);
      }
      cartDiv.appendChild(el(`<div class="cart-total"><span>Summe</span><span>${fmt(total)}</span></div>`));
      const bookBtn = el(`<button class="btn accent" style="width:100%; margin-top:12px;">Auf Konto buchen</button>`);
      bookBtn.addEventListener('click', async ()=>{
        bookBtn.disabled = true; bookBtn.textContent = 'Buche …';
        const items = cartKeys.map(pid=>{
          const p = state.products.find(pp=>pp.id===pid);
          return { productId: pid, name: p.name, price: p.price, qty: state.cart[pid] };
        });
        const tx = { id: uid(), type:'order', memberId: member.id, items, total, ts: Date.now() };
        const ok = await addTransaction(tx);
        if(ok){
          toast('Gebucht: ' + fmt(total) + ' für ' + fullName(member));
          closeOverlay();
        } else {
          toast('Speichern fehlgeschlagen – bitte erneut versuchen.');
          bookBtn.disabled = false; bookBtn.textContent = 'Auf Konto buchen';
        }
      });
      cartDiv.appendChild(bookBtn);
      footer.appendChild(cartDiv);
    }

    renderBody();
    renderFooter();
  }

  // ---------- ÜBERSICHT ----------
  function renderUebersicht(){

    const balances = active.map(m=>({m, bal: balanceOf(m.id)}));
    const totalOpen = balances.reduce((s,x)=>s + Math.max(0,x.bal), 0);

    wrap.appendChild(el(`
      <div class="summary-cards">
        <div class="card"><div class="big mono">${fmt(totalOpen)}</div><div class="lbl">Offene Summe</div></div>
        <div class="card"><div class="big">${debtors}</div><div class="lbl">Mit offenem Saldo</div></div>
        <div class="card"><div class="big">${active.length}</div><div class="lbl">Aktive Mitglieder</div></div>
        <div class="card"><div class="big mono" style="font-size:16px;">${top && top.bal>0.001 ? escapeHtml(fullName(top.m)) : '–'}</div><div class="lbl">Höchster Saldo</div></div>

      const table = el(`

          <thead><tr><th>Mitglied</th><th class="num">Saldo</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      `);
      const tbody = table.querySelector('tbody');
      balances.sort((a,b)=>b.bal-a.bal).forEach(({m,bal})=>{
        const cls = bal>0.001?'pos':(bal<-0.001?'neg':'zero');
        const tr = el(`
          <tr>
            <td>${escapeHtml(fullName(m))}</td>
            <td class="num balance ${cls}">${fmt(bal)}</td>
            <td style="text-align:right;"><button class="btn ghost" style="padding:5px 10px;">Zahlung erfassen</button></td>
          </tr>
        `);
        tr.querySelector('button').addEventListener('click', ()=> openPaymentModal(m));

    wrap.appendChild(card);

    const secCard = el(`
      <div class="card">
        <div class="section-title">Sicherheit</div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
          Theke-PIN gilt für alle, Admin-PIN schützt Übersicht, Mitglieder und Produkte.
        </div>
        <button class="btn ghost" id="changePinBtn">PINs ändern</button>
        <div style="margin-top:18px; padding-top:16px; border-top:1px solid var(--line);">
          <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
            <input type="checkbox" id="requireBarcodeToggle" ${state.settings.requireBarcodeForBookings?'checked':''} style="width:20px; height:20px; flex:0 0 auto;" />
            <span style="font-size:14px;">Barcode-Pflicht für Buchungen</span>
          </label>
          <div style="font-size:12.5px; color:var(--muted); margin-top:6px; margin-left:30px;">
            Wenn aktiv: Mitglieder, die einen Barcode hinterlegt haben, können an der
            Theke ausschließlich per Barcode-Scan ausgewählt werden - Antippen in der
            Liste ist für sie dann nicht mehr möglich. Mitglieder ohne hinterlegten
            Barcode sind davon nicht betroffen.
          </div>
        </div>
      </div>
    `);
    secCard.querySelector('#changePinBtn').addEventListener('click', openChangePinModal);
    secCard.querySelector('#requireBarcodeToggle').addEventListener('change', async (e)=>{
      state.settings.requireBarcodeForBookings = e.target.checked;
      const ok = await saveSettings();
      if(ok) toast(e.target.checked ? 'Barcode-Pflicht aktiviert' : 'Barcode-Pflicht deaktiviert');
      render();

  function openChangePinModal(){
    const backdrop = el(`
      <div class="modal-backdrop">
        <div class="modal">
          <h3>PINs ändern</h3>
          <div class="field">
            <label>Neues Theke-PIN (leer = unverändert)</label>
            <input type="text" id="newThekePin" placeholder="z. B. 4 Ziffern" />
          </div>
          <div class="field">
            <label>Neues Admin-PIN (leer = unverändert)</label>
            <input type="text" id="newAdminPin" placeholder="anderer Code als Theke-PIN" />
          </div>
          <div id="changePinError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="changePinCancel">Abbrechen</button>
            <button class="btn" id="changePinConfirm">Speichern</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(backdrop);
    backdrop.querySelector('#changePinCancel').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    backdrop.querySelector('#changePinConfirm').addEventListener('click', async ()=>{
      const newTheke = backdrop.querySelector('#newThekePin').value.trim();
      const newAdmin = backdrop.querySelector('#newAdminPin').value.trim();
      const err = backdrop.querySelector('#changePinError');
      if(!newTheke && !newAdmin){ err.textContent = 'Bitte mindestens ein Feld ausfüllen.'; return; }
      const r = await authAction({
        action: 'set_auth',
        thekePin: newTheke,
        adminPin: newAdmin,
        confirmPin: state.verifiedPin || ''
      });
      if(!r.ok){
        const reason = r.data && r.data.error;
        if(reason === 'unauthorized') err.textContent = 'Bestätigung fehlgeschlagen - bitte ab- und mit dem aktuellen Admin-PIN wieder anmelden.';
        else if(reason === 'theke_admin_must_differ') err.textContent = 'Theke-PIN und Admin-PIN müssen unterschiedlich sein.';
        else err.textContent = 'Speichern fehlgeschlagen.';
        return;
      }
      // Die soeben bestätigte PIN für diese Sitzung aktuell halten, falls sich
      // ausgerechnet der gerade genutzte Admin-PIN geändert hat.
      if(newAdmin) state.verifiedPin = newAdmin;
      backdrop.remove();
      toast('PINs aktualisiert');
    });
  }

  function openPaymentModal(member){
    const allowNegative = state.settings.modules.negativePayments;
    const backdrop = el(`
      <div class="modal-backdrop">
        <div class="modal">
          <h3>Zahlung erfassen</h3>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
            ${escapeHtml(fullName(member))} · aktueller Saldo: ${fmt(balanceOf(member.id))}
          </div>
          <div class="field">
            <label>Betrag (€)</label>
            <input type="number" id="payAmount" step="0.01" ${allowNegative ? '' : 'min="0"'} placeholder="${allowNegative ? 'z. B. 10,00 oder -10,00' : 'z. B. 10,00'}" />
          </div>
          ${allowNegative ? `
          <div style="font-size:12px; color:var(--muted); margin:-8px 0 4px;">
            Positiver Betrag = normale Zahlung (senkt den Saldo, größere Beträge als der
            offene Saldo bilden ein Guthaben ab). Negativer Betrag = Korrektur/Rückbuchung
            (erhöht den Saldo bzw. baut ein Guthaben wieder ab).
          </div>` : ''}
          <div class="field">
            <label>Zahlweise</label>
            <select id="payMethod">
              <option value="bar">Bar</option>
              <option value="ueberweisung">Überweisung</option>
              <option value="sepa">SEPA-Lastschrift</option>
              ${allowNegative ? '<option value="korrektur">Korrektur</option>' : ''}
            </select>
          </div>
          <div class="field">
            <label>Notiz (optional)</label>
            <input type="text" id="payNote" placeholder="z. B. Guthaben eingezahlt / Korrektur Buchung" />
          </div>
          <div class="modal-actions">
            <button class="btn ghost" id="payCancel">Abbrechen</button>
            <button class="btn" id="payConfirm">Speichern</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(backdrop);
    backdrop.querySelector('#payCancel').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    backdrop.querySelector('#payConfirm').addEventListener('click', async ()=>{
      const amt = parseFloat(backdrop.querySelector('#payAmount').value);
      if(isNaN(amt) || amt===0){ toast('Bitte einen gültigen Betrag ungleich 0 angeben.'); return; }
      if(!allowNegative && amt<0){ toast('Negative Beträge sind deaktiviert.'); return; }
      const method = backdrop.querySelector('#payMethod').value;
      const note = backdrop.querySelector('#payNote').value.trim();
      const tx = { id: uid(), type:'payment', memberId: member.id, amount: amt, method, note, ts: Date.now() };
      const ok = await addTransaction(tx);
      backdrop.remove();
      if(ok) toast((amt<0 ? 'Korrektur erfasst: ' : 'Zahlung erfasst: ') + fmt(Math.abs(amt)));
      else toast('Speichern fehlgeschlagen – bitte erneut versuchen.');
      render();
    });
  }

            </div>
          </div>
          <div id="editMemberError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="editMemberCancel">Abbrechen</button>
            <button class="btn" id="editMemberSave">Speichern</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(backdrop);
    const firstInput = backdrop.querySelector('#editMemberFirst');
    const lastInput = backdrop.querySelector('#editMemberLast');
    const barcodeInput = backdrop.querySelector('#editMemberBarcode');
    backdrop.querySelector('#editMemberScan')?.addEventListener('click', ()=>{
      openBarcodeScanner((code)=>{ barcodeInput.value = code; });
    });
    backdrop.querySelector('#editMemberCancel').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    const saveEdit = async ()=>{
      const firstName = firstInput.value.trim();
      const lastName = lastInput.value.trim();
      const barcode = barcodeInput.value.trim();
      const err = backdrop.querySelector('#editMemberError');
      if(!firstName || !lastName){ err.textContent = 'Bitte Vor- und Nachname angeben.'; return; }
      if(barcode && state.members.some(x=>x.id!==m.id && x.barcode===barcode)){
        err.textContent = 'Dieser Barcode ist bereits einem anderen Mitglied zugeordnet.'; return;
      }
      m.firstName = firstName; m.lastName = lastName; m.barcode = barcode || undefined;
      delete m.name;
      const ok = await saveMembers();
      if(!ok){ err.textContent = 'Speichern fehlgeschlagen.'; return; }
      backdrop.remove();
      toast('Mitglied aktualisiert');
      render();
    };
    backdrop.querySelector('#editMemberSave').addEventListener('click', saveEdit);
    lastInput.addEventListener('keydown', e=>{ if(e.key==='Enter') saveEdit(); });
    firstInput.addEventListener('keydown', e=>{ if(e.key==='Enter') lastInput.focus(); });
    setTimeout(()=>{ firstInput.focus(); firstInput.select(); }, 50);
  }

  function renderMitglieder(){

          await saveMembers(); render();

      empty.querySelector('#seedBtn').addEventListener('click', async ()=>{
        state.products.push(

          {id:uid(), name:'Apfelschorle', category:'Getränke', price:1.5, active:true},

          {id:uid(), name:'Radler', category:'Getränke', price:2.0, active:true},
          {id:uid(), name:'Cola', category:'Getränke', price:1.5, active:true},
          {id:uid(), name:'Chips', category:'Snacks', price:1.5, active:true},
          {id:uid(), name:'Müsliriegel', category:'Snacks', price:1.0, active:true},

    const listCard = el(`
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
          <div class="section-title" style="margin:0;">Alle Produkte</div>
          ${state.products.length>1 ? '<button class="btn ghost" id="sortProductsAz" style="padding:6px 12px; font-size:12.5px;">A–Z sortieren</button>' : ''}
        </div>
      </div>
    `);
    const sortProdBtn = listCard.querySelector('#sortProductsAz');
    if(sortProdBtn){
      sortProdBtn.addEventListener('click', async ()=>{
        state.products.sort((a,b)=>
          (a.category||'Sonstiges').localeCompare(b.category||'Sonstiges') || a.name.localeCompare(b.name)
        );
        await saveProducts(); render();
      });
    }
    const cats = [...new Set(state.products.map(p=>p.category||'Sonstiges'))];
    cats.forEach(cat=>{
      listCard.appendChild(el(`<div class="cat-label">${escapeHtml(cat)}</div>`));
      const table = el(`
        <table>
          <tbody></tbody>
        </table>
      `);
      const tbody = table.querySelector('tbody');
      const catItems = state.products.filter(p=>(p.category||'Sonstiges')===cat);
      catItems.forEach((p, posInCat)=>{
        const tr = el(`
          <tr>
            <td style="white-space:nowrap; padding-right:0;">
              <button class="icon-btn" data-act="up" title="Nach oben" ${posInCat===0?'disabled':''}>▲</button>
              <button class="icon-btn" data-act="down" title="Nach unten" ${posInCat===catItems.length-1?'disabled':''}>▼</button>
            </td>
            <td>${escapeHtml(p.name)}</td>
            <td class="num mono">${fmt(p.price)}</td>
            <td>${p.active===false ? 'inaktiv' : 'aktiv'}</td>
            <td style="text-align:right; white-space:nowrap;">
              <button class="icon-btn" data-act="edit" title="Bearbeiten">✎</button>
              <button class="icon-btn" data-act="toggle" title="Aktiv/Inaktiv">⇄</button>
              <button class="icon-btn" data-act="del" title="Löschen">✕</button>
            </td>
          </tr>
        `);
        tr.querySelector('[data-act="up"]').addEventListener('click', async ()=>{
          if(posInCat===0) return;
          const neighbor = catItems[posInCat-1];
          const i1 = state.products.indexOf(p), i2 = state.products.indexOf(neighbor);
          [state.products[i1], state.products[i2]] = [state.products[i2], state.products[i1]];
          await saveProducts(); render();
        });
        tr.querySelector('[data-act="down"]').addEventListener('click', async ()=>{
          if(posInCat===catItems.length-1) return;
          const neighbor = catItems[posInCat+1];
          const i1 = state.products.indexOf(p), i2 = state.products.indexOf(neighbor);
          [state.products[i1], state.products[i2]] = [state.products[i2], state.products[i1]];
          await saveProducts(); render();
        });
        tr.querySelector('[data-act="edit"]').addEventListener('click', ()=> openEditProductModal(p));
        tr.querySelector('[data-act="toggle"]').addEventListener('click', async ()=>{
          p.active = p.active === false ? true : false;
          await saveProducts(); render();
        });
        tr.querySelector('[data-act="del"]').addEventListener('click', async ()=>{
          if(!confirm('„'+p.name+'" wirklich löschen?')) return;
          state.products = state.products.filter(x=>x.id!==p.id);
          await saveProducts(); render();
        });
        tbody.appendChild(tr);
      });
      listCard.appendChild(table);
    });
    wrap.appendChild(listCard);
    return wrap;
  }

  // ---------- VERLAUF ----------

  function openOwnerPinModal(onSuccess){
    const hasOwnerPin = state.authStatus.hasOwnerPin;
    const backdrop = el(`
      <div class="modal-backdrop">
        <div class="modal">
          <h3>🔒 Nur Ersteller</h3>
          ${hasOwnerPin ? `
            <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
              Diese Aktion ist ausschließlich mit dem Ersteller-PIN möglich - nicht mit dem Admin-PIN.
            </div>
            <div class="field"><input type="password" id="ownerPinInput" inputmode="numeric" placeholder="Ersteller-PIN" /></div>
          ` : `
            <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
              Es ist noch kein Ersteller-PIN eingerichtet. Lege jetzt einen fest - nur du solltest ihn kennen,
              er ist unabhängig vom Theke- und Admin-PIN.
            </div>
            <div class="field"><input type="password" id="ownerPinInput" inputmode="numeric" placeholder="Neuen Ersteller-PIN festlegen" /></div>
          `}
          <div id="ownerPinError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="ownerPinCancel">Abbrechen</button>
            <button class="btn" id="ownerPinConfirm">${hasOwnerPin ? 'Bestätigen' : 'Festlegen &amp; fortfahren'}</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector('#ownerPinInput');
    const confirmBtn = backdrop.querySelector('#ownerPinConfirm');
    backdrop.querySelector('#ownerPinCancel').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    const confirmOwner = async ()=>{
      const pin = input.value.trim();
      const err = backdrop.querySelector('#ownerPinError');
      if(!pin){ err.textContent = 'Bitte einen PIN eingeben.'; return; }
      confirmBtn.disabled = true;
      if(hasOwnerPin){
        const level = await verifyPin(pin);
        confirmBtn.disabled = false;
        if(level !== 'owner'){
          err.textContent = 'Falscher PIN.'; input.value=''; input.focus(); return;
        }
        state.ownerUnlocked = true;
        backdrop.remove();
        onSuccess(pin);
      } else {
        const r = await authAction({ action:'set_auth', ownerPin: pin });
        confirmBtn.disabled = false;
        if(!r.ok){
          const reason = r.data && r.data.error;
          err.textContent = reason === 'owner_pin_must_differ'
            ? 'Bitte einen eigenen PIN wählen, der sich von Theke- und Admin-PIN unterscheidet.'
            : 'Speichern fehlgeschlagen.';
          return;
        }
        state.authStatus.hasOwnerPin = true;
        state.ownerUnlocked = true;
        backdrop.remove();
        toast('Ersteller-PIN festgelegt');
        onSuccess(pin);
      }
    };
    backdrop.querySelector('#ownerPinConfirm').addEventListener('click', confirmOwner);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmOwner(); });
    setTimeout(()=>input.focus(), 50);
  }

  // Lädt eine Seite Buchungen passend zum aktuellen Filter nach. reset=true
  // beginnt von vorn (Filteränderung), reset=false hängt eine weitere Seite an
  // ("Weitere laden").
  async function loadVerlaufPage(reset){
    const f = state.verlaufFilter;
    if(reset){
      state.verlaufData.items = [];
      state.verlaufData.offset = 0;
    }
    state.verlaufData.loading = true;
    render();
    const payload = { action:'list_transactions', limit:100, offset: state.verlaufData.offset };
    if(f.memberId) payload.memberId = f.memberId;
    if(f.type) payload.type = f.type;
    if(f.from) payload.from = new Date(f.from + 'T00:00:00').getTime();
    if(f.to) payload.to = new Date(f.to + 'T23:59:59').getTime();
    const r = await apiAction(payload);
    state.verlaufData.loading = false;
    if(r.ok && r.data){
      state.verlaufData.items = state.verlaufData.items.concat(r.data.transactions);
      state.verlaufData.total = r.data.total;
      state.verlaufData.summary = r.data.summary || { orderSum:0, paymentSum:0, correctionSum:0 };
      state.verlaufData.offset += r.data.transactions.length;
      // filterKey nur bei Erfolg setzen: schlägt das Laden fehl (z. B. kurzer
      // Netzwerk-/Serverfehler), bleibt der Filter "nicht erledigt" und kann
      // erneut versucht werden, statt dauerhaft leer/veraltet stehen zu bleiben.
      state.verlaufData.filterKey = JSON.stringify(f);
    } else {
      toast('Verlauf konnte nicht geladen werden.');
    }
    // In jedem Fall merken, dass für diesen Filterstand schon ein Versuch
    // lief - verhindert eine Endlosschleife aus Neu-Rendern und Neu-Laden,
    // falls der Fehler dauerhaft ist. Ein "Erneut versuchen"-Klick oder eine
    // Filteränderung setzt das wieder zurück.
    state.verlaufData.attemptedKey = JSON.stringify(f);
    render();
  }

  function renderVerlauf(){
    const wrap = document.createElement('div');
    const f = state.verlaufFilter;
    const filterActive = !!(f.memberId || f.type || f.from || f.to);
    const d = state.verlaufData;

    // Filter hat sich geändert (oder erster Aufruf) -> im Hintergrund neu laden.
    // attemptedKey verhindert, dass ein dauerhafter Fehler bei jedem Rendern
    // sofort einen neuen (aussichtslosen) Versuch auslöst.
    if(d.filterKey !== JSON.stringify(f) && d.attemptedKey !== JSON.stringify(f) && !d.loading){
      loadVerlaufPage(true);
    }

    const card = el(`
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
          <div class="section-title" style="margin:0;">Buchungsverlauf</div>
          ${d.total>0 ? '<button class="btn danger" id="clearHistoryBtn" style="padding:6px 12px; font-size:12.5px;">🔒 Verlauf löschen</button>' : ''}
        </div>
      </div>
    `);
    const clearBtn = card.querySelector('#clearHistoryBtn');
    if(clearBtn){
      clearBtn.addEventListener('click', ()=>{
        openOwnerPinModal((ownerPin)=>{
          const really = confirm(
            'Wirklich den GESAMTEN Buchungsverlauf unwiderruflich löschen?\n\n' +
            'Alle Salden werden dadurch auf 0,00 € zurückgesetzt. Mitglieder und Produkte bleiben erhalten.'
          );
          if(!really) return;
          apiAction({ action:'clear_transactions', confirmPin: ownerPin }).then(r=>{
            if(r.ok){
              state.balances = {};
              state.verlaufData = { filterKey:null, attemptedKey:null, items:[], total:0, offset:0, loading:false };
              toast('Buchungsverlauf gelöscht – Salden zurückgesetzt');
            } else {
              toast('Löschen fehlgeschlagen.');
            }
            render();
          });
        });
      });
    }

    // ---- Filterleiste ----
    if(state.settings.modules.verlaufFilter){
      const membersForFilter = state.members.slice().sort((a,b)=> fullName(a).localeCompare(fullName(b)));
      const filterCard = el(`
        <div class="card">
          <div class="row" style="align-items:flex-end;">
            <div class="field" style="flex:1; min-width:170px; margin-bottom:0;">
              <label>Mitglied</label>
              <select id="filterMember">
                <option value="">Alle Mitglieder</option>
                ${membersForFilter.map(m=>`<option value="${m.id}" ${f.memberId===m.id?'selected':''}>${escapeHtml(fullName(m))}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="flex:1; min-width:150px; margin-bottom:0;">
              <label>Art</label>
              <select id="filterType">
                <option value="" ${f.type===''?'selected':''}>Alle</option>
                <option value="order" ${f.type==='order'?'selected':''}>Bestellungen</option>
                <option value="payment" ${f.type==='payment'?'selected':''}>Zahlungen</option>
                <option value="korrektur" ${f.type==='korrektur'?'selected':''}>Korrekturen</option>
              </select>
            </div>
            <div class="field" style="flex:1; min-width:140px; margin-bottom:0;">
              <label>Von</label>
              <input type="date" id="filterFrom" value="${f.from}" />
            </div>
            <div class="field" style="flex:1; min-width:140px; margin-bottom:0;">
              <label>Bis</label>
              <input type="date" id="filterTo" value="${f.to}" />
            </div>
            <button class="btn ghost" id="filterReset" style="flex:0 0 auto;">Zurücksetzen</button>
          </div>
        </div>
      `);
      filterCard.querySelector('#filterMember').addEventListener('change', e=>{ f.memberId = e.target.value; render(); });
      filterCard.querySelector('#filterType').addEventListener('change', e=>{ f.type = e.target.value; render(); });
      filterCard.querySelector('#filterFrom').addEventListener('change', e=>{ f.from = e.target.value; render(); });
      filterCard.querySelector('#filterTo').addEventListener('change', e=>{ f.to = e.target.value; render(); });
      filterCard.querySelector('#filterReset').addEventListener('click', ()=>{
        state.verlaufFilter = { memberId:'', type:'', from:'', to:'' };
        render();
      });
      wrap.appendChild(filterCard);
    }

    if(state.adminUnlocked && state.settings.modules.verlaufSummary){
      const s = d.summary;
      wrap.appendChild(el(`
        <div class="summary-cards">
          <div class="card"><div class="big mono">${fmt(s.orderSum)}</div><div class="lbl">Bestellungen (Umsatz)</div></div>
          <div class="card"><div class="big mono">${fmt(s.paymentSum)}</div><div class="lbl">Zahlungen erhalten</div></div>
          <div class="card"><div class="big mono">${fmt(s.correctionSum)}</div><div class="lbl">Korrekturen</div></div>
        </div>
      `));
    }

    if(d.items.length===0){
      const currentKey = JSON.stringify(f);
      const loadFailed = !d.loading && d.attemptedKey === currentKey && d.filterKey !== currentKey;
      if(loadFailed){
        const errBox = el(`
          <div class="empty">
            Verlauf konnte nicht geladen werden.<br>
            <button class="btn ghost" id="verlaufRetryBtn" style="margin-top:10px;">Erneut versuchen</button>
          </div>
        `);
        errBox.querySelector('#verlaufRetryBtn').addEventListener('click', ()=> loadVerlaufPage(true));
        card.appendChild(errBox);
      } else {
        card.appendChild(el(`<div class="empty">${d.loading ? 'Lade …' : (filterActive ? 'Keine Buchungen für diesen Filter.' : 'Noch keine Buchungen.')}</div>`));
      }
      wrap.appendChild(card);
      return wrap;
    }

    const table = el(`
      <table>
        <thead><tr><th>Datum</th><th>Mitglied</th><th>Art</th><th></th><th class="num">Betrag</th></tr></thead>
        <tbody></tbody>
      </table>
    `);
    const tbody = table.querySelector('tbody');
    d.items.forEach(t=>{
      const m = state.members.find(mm=>mm.id===t.memberId);
      const date = new Date(t.ts).toLocaleString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});
      if(t.type==='order'){
        const itemCount = t.items.reduce((s,i)=>s+i.qty,0);
        const detail = t.items.map(i=>`${i.qty}× ${escapeHtml(i.name)}`).join(', ');
        const tr = el(`
          <tr>
            <td class="mono" style="font-size:12px; color:var(--muted);">${date}</td>
            <td>${m ? escapeHtml(fullName(m)) : '<em>gelöscht</em>'}</td>
            <td>Bestellung ${tallyIcon(itemCount)}</td>
            <td style="font-size:12.5px; color:var(--muted); max-width:220px;">${detail}</td>
            <td class="num balance pos">${fmt(t.total)}</td>
          </tr>
        `);
        tbody.appendChild(tr);
      } else {
        const methodLabel = {bar:'Bar', ueberweisung:'Überweisung', sepa:'SEPA', korrektur:'Korrektur'}[t.method] || t.method;
        // Auswirkung auf den Saldo: normale (positive) Zahlung senkt ihn (grün, -),
        // negative Zahlung/Korrektur erhöht ihn wieder (rot, +).
        const change = -t.amount;
        const changeCls = change <= 0 ? 'neg' : 'pos';
        const changeSign = change <= 0 ? '−' : '+';
        const tr = el(`
          <tr>
            <td class="mono" style="font-size:12px; color:var(--muted);">${date}</td>
            <td>${m ? escapeHtml(fullName(m)) : '<em>gelöscht</em>'}</td>
            <td>${t.amount<0 ? 'Korrektur' : 'Zahlung'} (${methodLabel})</td>
            <td style="font-size:12.5px; color:var(--muted);">${escapeHtml(t.note||'')}</td>
            <td class="num balance ${changeCls}">${changeSign}${fmt(Math.abs(change))}</td>
          </tr>
        `);
        tbody.appendChild(tr);
      }
    });
    card.appendChild(table);

    if(d.items.length < d.total){
      const moreBtn = el(`<button class="btn ghost" style="width:100%; margin-top:12px;">Weitere laden (${d.items.length} von ${d.total})</button>`);
      moreBtn.disabled = d.loading;
      moreBtn.addEventListener('click', ()=> loadVerlaufPage(false));
      card.appendChild(moreBtn);
    } else if(d.total > d.items.length){
      // (unreachable normally, kept as safety net for inconsistent state)
    }

    wrap.appendChild(card);
    return wrap;
  }

  function renderModule(){
    const wrap = document.createElement('div');
    wrap.appendChild(el(`
      <div class="card">
        <div class="section-title">Module</div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:4px;">
          Einzelne Funktionen der App global ein- oder ausschalten. Nur für dich als
          Ersteller sichtbar und bedienbar - Änderungen wirken sich sofort auf alle
          Nutzer:innen der App aus.
        </div>
      </div>
    `));

    const listCard = el(`<div class="card"></div>`);
    MODULE_DEFS.forEach(mod=>{
      const enabled = state.settings.modules[mod.key] !== false;
      const row = el(`
        <div style="display:flex; align-items:flex-start; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);">
          <label style="flex:0 0 auto; margin-top:2px;">
            <input type="checkbox" data-mod="${mod.key}" ${enabled?'checked':''} style="width:22px; height:22px; cursor:pointer;" />
          </label>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:15px;">${escapeHtml(mod.title)}</div>
            <div style="font-size:12.5px; color:var(--muted); margin-top:3px;">${escapeHtml(mod.description)}</div>
          </div>
        </div>
      `);
      row.querySelector('input').addEventListener('change', async (e)=>{
        state.settings.modules[mod.key] = e.target.checked;
        const ok = await saveSettings();
        if(ok) toast((mod.title) + (e.target.checked ? ' aktiviert' : ' deaktiviert'));
        render();
      });
      listCard.appendChild(row);
    });
    // Letzte Trennlinie entfernen
    const lastRow = listCard.lastElementChild;
    if(lastRow) lastRow.style.borderBottom = 'none';

    wrap.appendChild(listCard);
    return wrap;
  }

  loadAll();
})();
</script>
</body>
</html>

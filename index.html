  #app{
    max-width:960px;margin:0 auto; position:relative; z-index:1; width:100%;
    flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;
  }
  #app > header{ flex:0 0 auto; }
  #app > main{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #app > div{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  footer{ flex:0 0 auto; }

  /* Tablets im Hochformat / kleine Desktop-Fenster */
  @media (min-width: 700px){
    #app{max-width:1100px;}
  }

  /* Große Tablets (z. B. Fire HD 10 quer) & Desktop */
  @media (min-width: 1100px){
    #app{max-width:1500px;}
    main{padding:28px 36px;}
    .member-grid{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:16px; }
    .product-grid{ grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
    .member-chip, .product-btn{ padding:18px 16px; }
    button.btn{ padding:14px 20px; font-size:16px; }
    nav.tabs button{ font-size:20px; padding:14px 20px 16px; }
  }

  /* Kiosk-Feel: kein versehentliches Markieren/Callout beim Antippen */
  button, .member-chip, .product-btn, nav.tabs, .icon-btn{
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  html{ -webkit-tap-highlight-color: transparent; overscroll-behavior:none; }

  .display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* HEADER */
  header.top{
    background: var(--court);
    color: var(--chalk);
    padding: 22px 20px 0;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .brand-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .logo-badge{
    background: var(--chalk);
    border-radius: 12px;
    padding: 6px 10px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  .club-logo{
    height:44px; width:auto; flex:0 0 auto; display:block;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .logo-badge .club-logo{
    height:72px;
    filter:none;
  }
  .brand-name{
    font-family:'Bebas Neue', sans-serif; font-size:29px; line-height:1.05; flex:1;
    letter-spacing:0.03em; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 9px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  }
  .brand-name .main{ color: var(--chalk); }
  .brand-name .accent{ color: var(--ball); }
  .subtitle{font-size:13px; color: rgba(247,245,239,0.65); margin:-6px 0 16px; letter-spacing:0.02em;}

  nav.tabs{ display:flex; gap:2px; overflow-x:auto; }
  nav.tabs button{
    background:none; border:none; color: rgba(247,245,239,0.6);
    font-family:'Bebas Neue', sans-serif; font-size:19px; letter-spacing:0.03em;
    padding:13px 16px 15px; min-height:48px; cursor:pointer; white-space:nowrap;
    border-bottom: 3px solid transparent;
  }
  nav.tabs button.active{ color: var(--ball); border-bottom-color: var(--ball); }
  nav.tabs button:hover:not(.active){ color: var(--chalk); }

  main{padding:20px; box-sizing:border-box;}

  /* CARDS / GENERIC */
  .card{
    background:#fff; border:1px solid var(--line); border-radius: var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .section-title{
    font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:0.02em;
    margin:0 0 12px; color: var(--court);
  }
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  input[type=text], input[type=number], select{
    font-family:'Inter', sans-serif; font-size:16px;
    padding:12px 14px; min-height:46px; border:1px solid var(--line); border-radius:8px;
    background:#fff; color:var(--ink); outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus{ border-color: var(--court-light); }
  button.btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:15px;
    padding:12px 18px; min-height:46px; border-radius:8px; border:1px solid var(--court);
    background: var(--court); color:#fff; cursor:pointer;
  }
  button.btn:hover{ background: var(--court-light); }
  button.btn.ghost{ background:transparent; color:var(--court); }
  button.btn.ghost:hover{ background: rgba(27,67,50,0.06); }
  button.btn.danger{ background:#fff; color:var(--danger); border-color:var(--danger); }
  button.btn.danger:hover{ background: rgba(193,68,46,0.08); }
  button.btn.accent{ background: var(--ball); color: var(--ink); border-color: var(--ball); }
  button.btn.accent:hover{ filter:brightness(0.95); }
  button.btn:disabled{ opacity:0.4; cursor:not-allowed; }
  button.icon-btn{
    background:none; border:none; cursor:pointer; color:var(--muted); font-size:20px;
    padding:8px; min-width:40px; min-height:40px; display:inline-flex; align-items:center; justify-content:center;
  }
  button.icon-btn:hover{ color:var(--danger); }

  /* TALLY signature element */
  .tally{ display:inline-flex; gap:3px; align-items:flex-end; }
  .tally-group{ display:inline-flex; position:relative; width:16px; height:16px; margin-right:3px; }
  .tally-group span{
    position:absolute; bottom:0; width:2px; height:14px; background: var(--court-light); border-radius:1px;
  }
  .tally-group span:nth-child(1){ left:0px; }
  .tally-group span:nth-child(2){ left:4px; }
  .tally-group span:nth-child(3){ left:8px; }
  .tally-group span:nth-child(4){ left:12px; }
  .tally-group span:nth-child(5){
    width:18px; height:2px; top:6px; left:-1px; transform:rotate(-35deg); background:var(--clay);
  }

  /* THEKE VIEW */
  .member-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:12px; }
  .member-chip{
    border:1px solid var(--line); border-radius:10px; padding:16px 14px; background:#fff;
    cursor:pointer; text-align:left; transition: border-color .1s, transform .05s; min-height:64px;
  }
  .member-chip:hover{ border-color: var(--court-light); }
  .member-chip.selected{ border-color: var(--court); box-shadow: 0 0 0 2px var(--court) inset; }
  .member-chip .name{ font-weight:600; font-size:16px; margin-bottom:5px; }
  .member-chip .balance{ font-family:'JetBrains Mono', monospace; font-size:14.5px; }
  .balance.pos{ color: var(--danger); }
  .balance.zero{ color: var(--muted); }
  .balance.neg{ color: #2D6A4F; }

  .search-input{ width:100%; padding:13px 14px; min-height:46px; margin-bottom:14px; }

  .order-panel{ border-top:3px solid var(--ball); }
  .cat-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);
    margin:14px 0 8px; font-weight:600;
  }
  .cat-label:first-child{ margin-top:0; }
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
  .product-btn{
    border:1px solid var(--line); border-radius:10px; background:#fff; padding:14px 10px;
    cursor:pointer; text-align:center; min-height:64px;
  }
  .product-btn:hover{ border-color:var(--ball); background: rgba(245,205,75,0.18); }
  .product-btn .pname{ font-size:15px; font-weight:600; display:block; }
  .product-btn .pprice{ font-family:'JetBrains Mono', monospace; font-size:13.5px; color:var(--muted); margin-top:2px; display:block; }

  .cart{ margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
  .cart-row{ display:flex; justify-content:space-between; align-items:center; font-size:15.5px; padding:8px 0; }
  .cart-row .qty-controls{ display:flex; align-items:center; gap:8px; }
  .qty-controls button{
    width:36px; height:36px; font-size:18px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer;
  }
  .cart-total{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:18px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }

  /* TABLES */
  table{ width:100%; border-collapse:collapse; font-size:15px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); padding:9px 10px; border-bottom:1px solid var(--line); }
  td{ padding:13px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'JetBrains Mono', monospace; text-align:right; }

  .summary-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .summary-cards .card{ margin-bottom:0; text-align:center; }
  .summary-cards .big{ font-family:'Bebas Neue', sans-serif; font-size:32px; color:var(--court); }
  .summary-cards .lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }

  .empty{ text-align:center; padding:30px 10px; color:var(--muted); }
  .empty .display{ font-size:22px; color:var(--court); display:block; margin-bottom:6px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(22,36,29,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  .modal{ background:#fff; border-radius:var(--radius); padding:24px; width:100%; max-width:400px; }
  .modal h3{ font-family:'Bebas Neue', sans-serif; font-size:22px; margin:0 0 14px; color:var(--court); }
  .modal .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .modal .field label{ font-size:13px; color:var(--muted); }
  .modal .field input, .modal .field select{ width:100%; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:8px; font-size:14.5px; z-index:60;
    opacity:0; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .loading{ text-align:center; padding:60px 10px; color:var(--muted); font-family:'Bebas Neue',sans-serif; font-size:18px;}

  @media (max-width:520px){
    .brand-name{ font-size:23px; }
    .logo-badge{ padding:4px 7px; border-radius:9px; }
    .logo-badge .club-logo{ height:52px; }
    .summary-cards{ grid-template-columns:1fr 1fr; }
    main{ padding:14px; }
    .card{ padding:14px; }
    nav.tabs button{ font-size:16px; padding:11px 12px 13px; }
    button.btn{ padding:12px 14px; font-size:14.5px; }
    .modal{ padding:18px; max-width:100%; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Lade Tresen …</div></div>
<footer style="position:relative; z-index:1; text-align:center; padding:18px 10px 26px; font-size:11.5px; color:var(--muted); font-family:'Inter', sans-serif;">
  Erstellt von Marco Weber für SG Germania Binsfeld Tennis
</footer>

<script>
(function(){
  "use strict";

  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  const fmt = (n) => (Math.round(n*100)/100).toFixed(2).replace('.', ',') + ' €';

  let state = {
    loaded: false,
    settings: { clubName: 'SG Germania Binsfeld Tennis' },
    members: [],
    products: [],
    transactions: [],
    auth: null, // {thekePin, adminPin}
    thekeUnlocked: false,
    adminUnlocked: false,
    view: 'theke',
    selectedMember: null,
    cart: {}, // productId -> qty
    memberSearch: '',
  };

  const ADMIN_VIEWS = ['uebersicht','mitglieder','produkte'];

  async function loadAll(){
    try {
      const [s, m, p, t, a] = await Promise.all([
        safeGet('settings'), safeGet('members'), safeGet('products'), safeGet('transactions'), safeGet('auth')
      ]);
      if (s) state.settings = JSON.parse(s.value);
      if (m) state.members = JSON.parse(m.value);
      if (p) state.products = JSON.parse(p.value);
      if (t) state.transactions = JSON.parse(t.value);
      if (a) state.auth = JSON.parse(a.value);
    } catch(e){ console.error('Ladefehler', e); }
    state.loaded = true;
    render();
  }

  function saveAuth(){ return saveKey('auth', state.auth); }

  async function safeGet(key){
    try {
      const res = await fetch('api.php?key=' + encodeURIComponent(key));
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json(); // {key, value}
    } catch(e){ console.error(e); return null; }
  }
  async function saveKey(key, value){
    try {
      const res = await fetch('api.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ action:'set', key, value: JSON.stringify(value) })
      });
      if(!res.ok){ toast('Speichern fehlgeschlagen – bitte erneut versuchen.'); return null; }
      return await res.json();
    } catch(e){ console.error(e); toast('Speicherfehler: ' + e.message); return null; }
  }

  function saveMembers(){ return saveKey('members', state.members); }
  function saveProducts(){ return saveKey('products', state.products); }
  function saveTransactions(){ return saveKey('transactions', state.transactions); }
  function saveSettings(){ return saveKey('settings', state.settings); }

  function balanceOf(memberId){
    let bal = 0;
    for(const t of state.transactions){
      if(t.memberId !== memberId) continue;
      if(t.type === 'order') bal += t.total;
      if(t.type === 'payment') bal -= t.amount;
    }
    return bal;
  }

  function toast(msg){
    let el = document.getElementById('toast');
    if(!el){
      el = document.createElement('div'); el.id='toast'; el.className='toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(()=> el.classList.remove('show'), 2400);
  }

  function el(html){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tallyIcon(count){
    const groups = Math.ceil(count/5) || 0;
    let html = '<span class="tally">';
    let remaining = count;
    for(let g=0; g<groups; g++){
      const n = Math.min(5, remaining);
      remaining -= n;
      let bars = '';
      for(let i=0;i<n;i++) bars += '<span></span>';
      html += '<span class="tally-group">'+bars+'</span>';
    }
    html += '</span>';
    return html;
  }

  // ---------- RENDER ----------
  function render(){
    const app = document.getElementById('app');
    if(!state.loaded){ app.innerHTML = '<div class="loading">Lade Tresen …</div>'; return; }

    app.innerHTML = '';
    if(!state.auth){ app.appendChild(renderSetupScreen()); return; }
    if(!state.thekeUnlocked){ app.appendChild(renderLockScreen()); return; }
    app.appendChild(renderHeader());
    const main = document.createElement('main');
    main.appendChild(renderView());
    app.appendChild(main);
  }

  function renderSetupScreen(){
    const wrap = el(`
      <div style="max-width:380px; margin:60px auto; padding:0 16px;">
        <div class="card">
          <div class="section-title">Zugriffsschutz einrichten</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:14px;">
            Einmalige Ersteinrichtung für euren Tresen. Legt zwei PINs fest:
            das <strong>Theke-PIN</strong> für alle, die buchen, und das
            <strong>Admin-PIN</strong> für Verwaltung &amp; Zahlungen (z. B. Vorstand/Kasse).
          </div>
          <div class="field">
            <label>Theke-PIN</label>
            <input type="text" id="setupTheke" placeholder="z. B. 4 Ziffern" />
          </div>
          <div class="field">
            <label>Admin-PIN</label>
            <input type="text" id="setupAdmin" placeholder="anderer Code als Theke-PIN" />
          </div>
          <div id="setupError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <button class="btn accent" id="setupBtn" style="width:100%;">Einrichten</button>
        </div>
      </div>
    `);
    wrap.querySelector('#setupBtn').addEventListener('click', async ()=>{
      const tp = wrap.querySelector('#setupTheke').value.trim();
      const ap = wrap.querySelector('#setupAdmin').value.trim();
      const err = wrap.querySelector('#setupError');
      if(!tp || !ap){ err.textContent = 'Bitte beide PINs ausfüllen.'; return; }
      if(tp === ap){ err.textContent = 'Theke-PIN und Admin-PIN sollten unterschiedlich sein.'; return; }
      state.auth = { thekePin: tp, adminPin: ap };
      const ok = await saveAuth();
      if(!ok){ err.textContent = 'Speichern fehlgeschlagen, bitte erneut versuchen.'; return; }
      state.thekeUnlocked = true;
      state.adminUnlocked = true;
      toast('Zugriffsschutz eingerichtet');
      render();
    });
    return wrap;
  }

  function openAdminPinModal(onUnlocked){
    const backdrop = el(`
      <div class="modal-backdrop">
        <div class="modal">
          <h3>🔒 Admin-Bereich</h3>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
            Für diesen Bereich ist das Admin-PIN nötig.
          </div>
          <div class="field">
            <input type="password" id="adminPinInput" inputmode="numeric" placeholder="Admin-PIN" />
          </div>
          <div id="adminPinError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="adminPinCancel">Abbrechen</button>
            <button class="btn" id="adminPinConfirm">Entsperren</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector('#adminPinInput');
    backdrop.querySelector('#adminPinCancel').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    const confirmPin = ()=>{
      const pin = input.value.trim();
      if(pin && pin === state.auth.adminPin){
        state.adminUnlocked = true;
        backdrop.remove();
        onUnlocked();
      } else {
        backdrop.querySelector('#adminPinError').textContent = 'Falscher PIN.';
        input.value=''; input.focus();
      }
    };
    backdrop.querySelector('#adminPinConfirm').addEventListener('click', confirmPin);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmPin(); });
    setTimeout(()=>input.focus(), 50);
  }

  function renderHeader(){
    const nameWords = state.settings.clubName.trim().split(/\s+/);
    const brandAccent = nameWords.length > 1 ? nameWords.pop() : '';
    const brandMain = nameWords.join(' ');
    const header = el(`

          openAdminPinModal(()=>{ state.view = targetView; state.selectedMember=null; render(); });

  function tabBtn(view, label){
    const showLock = ADMIN_VIEWS.includes(view) && !state.adminUnlocked;
    return `<button data-view="${view}" class="${state.view===view?'active':''}">${showLock?'🔒 ':''}${label}</button>`;
  }

  function renderView(){
    switch(state.view){
      case 'theke': return renderTheke();
      case 'uebersicht': return renderUebersicht();
      case 'mitglieder': return renderMitglieder();
      case 'produkte': return renderProdukte();
      case 'verlauf': return renderVerlauf();
      default: return document.createElement('div');
    }
  }

  // ---------- THEKE ----------
  function renderTheke(){
    const wrap = document.createElement('div');

    if(state.members.length === 0){
      wrap.appendChild(el(`
        <div class="card empty">
          <span class="display">Noch keine Mitglieder</span>
          Lege zuerst Mitglieder unter „Mitglieder" an, um an der Theke buchen zu können.
        </div>
      `));
      return wrap;
    }

    const card = el(`<div class="card"></div>`);
    const search = el(`<input class="search-input" type="text" placeholder="Mitglied suchen …" />`);
    search.value = state.memberSearch;
    search.addEventListener('input', ()=>{ state.memberSearch = search.value; renderMemberGrid(grid); });
    card.appendChild(search);
    const grid = el(`<div class="member-grid"></div>`);
    card.appendChild(grid);
    wrap.appendChild(card);
    renderMemberGrid(grid);

    if(state.selectedMember){
      wrap.appendChild(renderOrderPanel());
    }
    return wrap;
  }

  function renderMemberGrid(grid){
    grid.innerHTML = '';
    const q = state.memberSearch.trim().toLowerCase();
    const list = state.members
      .filter(m=>m.active !== false)
      .filter(m=> !q || m.name.toLowerCase().includes(q))
      .sort((a,b)=>a.name.localeCompare(b.name));
    if(list.length===0){
      grid.appendChild(el(`<div class="empty" style="grid-column:1/-1;">Keine Treffer.</div>`));
      return;
    }
    for(const m of list){
      const bal = balanceOf(m.id);
      const cls = bal > 0.001 ? 'pos' : (bal < -0.001 ? 'neg' : 'zero');
      const chip = el(`
        <button class="member-chip ${state.selectedMember===m.id?'selected':''}">
          <div class="name">${escapeHtml(m.name)}</div>
          <div class="balance ${cls}">${fmt(bal)}</div>
        </button>
      `);
      chip.addEventListener('click', ()=>{
        state.selectedMember = state.selectedMember === m.id ? null : m.id;
        state.cart = {};
        render();
      });
      grid.appendChild(chip);
    }
  }

  function renderOrderPanel(){
    const member = state.members.find(m=>m.id===state.selectedMember);
    const panel = el(`<div class="card order-panel"></div>`);
    panel.appendChild(el(`<div class="section-title">Bestellung für ${escapeHtml(member.name)}</div>`));

    if(state.products.length === 0){
      panel.appendChild(el(`<div class="empty">Noch keine Produkte angelegt. Lege welche unter „Produkte" an.</div>`));
      return panel;
    }

    const cats = [...new Set(state.products.map(p=>p.category || 'Sonstiges'))];
    for(const cat of cats){
      panel.appendChild(el(`<div class="cat-label">${escapeHtml(cat)}</div>`));
      const pg = el(`<div class="product-grid"></div>`);
      state.products.filter(p=>(p.category||'Sonstiges')===cat).forEach(p=>{
        const btn = el(`
          <button class="product-btn">
            <span class="pname">${escapeHtml(p.name)}</span>
            <span class="pprice">${fmt(p.price)}</span>
          </button>
        `);
        btn.addEventListener('click', ()=>{
          state.cart[p.id] = (state.cart[p.id]||0) + 1;
          render();
        });
        pg.appendChild(btn);
      });
      panel.appendChild(pg);
    }

    // cart
    const cartKeys = Object.keys(state.cart).filter(k=>state.cart[k]>0);
    const cartDiv = el(`<div class="cart"></div>`);
    if(cartKeys.length === 0){
      cartDiv.appendChild(el(`<div style="color:var(--muted); font-size:13px;">Noch nichts ausgewählt.</div>`));
    } else {
      let total = 0;
      for(const pid of cartKeys){
        const p = state.products.find(pp=>pp.id===pid);
        if(!p) continue;
        const qty = state.cart[pid];
        total += p.price * qty;
        const row = el(`
          <div class="cart-row">
            <span>${escapeHtml(p.name)}</span>
            <div class="qty-controls">
              <button data-act="dec">–</button>
              <span class="mono">${qty}</span>
              <button data-act="inc">+</button>
              <span class="mono" style="width:60px; text-align:right;">${fmt(p.price*qty)}</span>
            </div>
          </div>
        `);
        row.querySelector('[data-act="dec"]').addEventListener('click', ()=>{
          state.cart[pid] = Math.max(0, state.cart[pid]-1);
          render();
        });
        row.querySelector('[data-act="inc"]').addEventListener('click', ()=>{
          state.cart[pid] += 1;
          render();
        });
        cartDiv.appendChild(row);
      }
      cartDiv.appendChild(el(`<div class="cart-total"><span>Summe</span><span>${fmt(total)}</span></div>`));
      const bookBtn = el(`<button class="btn accent" style="width:100%; margin-top:12px;">Auf Konto buchen</button>`);
      bookBtn.addEventListener('click', async ()=>{
        bookBtn.disabled = true; bookBtn.textContent = 'Buche …';
        const items = cartKeys.map(pid=>{
          const p = state.products.find(pp=>pp.id===pid);
          return { productId: pid, name: p.name, price: p.price, qty: state.cart[pid] };
        });
        const tx = { id: uid(), type:'order', memberId: member.id, items, total, ts: Date.now() };
        state.transactions.push(tx);
        const ok = await saveTransactions();
        if(ok) toast('Gebucht: ' + fmt(total) + ' für ' + member.name);
        state.cart = {};
        render();
      });
      cartDiv.appendChild(bookBtn);
    }
    panel.appendChild(cartDiv);
    return panel;
  }

  // ---------- ÜBERSICHT ----------

        <div class="card"><div class="big mono" style="font-size:16px;">${top && top.bal>0.001 ? escapeHtml(top.m.name) : '–'}</div><div class="lbl">Höchster Saldo</div></div>

          <tbody></tbody>
        </table>
      `);
      const tbody = table.querySelector('tbody');

  function openOwnerPinModal(onSuccess){
    const hasOwnerPin = !!(state.auth.ownerPin);
    const backdrop = el(`
      <div class="modal-backdrop">
        <div class="modal">
          <h3>🔒 Nur Ersteller</h3>
          ${hasOwnerPin ? `
            <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">

          ` : `
            <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
              Es ist noch kein Ersteller-PIN eingerichtet. Lege jetzt einen fest - nur du solltest ihn kennen,
              er ist unabhängig vom Theke- und Admin-PIN.
            </div>
            <div class="field"><input type="password" id="ownerPinInput" inputmode="numeric" placeholder="Neuen Ersteller-PIN festlegen" /></div>
          `}
          <div id="ownerPinError" style="color:var(--danger); font-size:12.5px; min-height:16px;"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="ownerPinCancel">Abbrechen</button>
            <button class="btn" id="ownerPinConfirm">${hasOwnerPin ? 'Bestätigen' : 'Festlegen &amp; fortfahren'}</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector('#ownerPinInput');
    backdrop.querySelector('#ownerPinCancel').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    const confirmOwner = async ()=>{
      const pin = input.value.trim();
      const err = backdrop.querySelector('#ownerPinError');
      if(!pin){ err.textContent = 'Bitte einen PIN eingeben.'; return; }
      if(hasOwnerPin){
        if(pin !== state.auth.ownerPin){
          err.textContent = 'Falscher PIN.'; input.value=''; input.focus(); return;
        }
        backdrop.remove();
        onSuccess();
      } else {
        if(pin === state.auth.thekePin || pin === state.auth.adminPin){
          err.textContent = 'Bitte einen eigenen PIN wählen, der sich von Theke- und Admin-PIN unterscheidet.';
          return;
        }
        state.auth.ownerPin = pin;
        const ok = await saveAuth();
        if(!ok){ err.textContent = 'Speichern fehlgeschlagen.'; return; }
        backdrop.remove();
        toast('Ersteller-PIN festgelegt');
        onSuccess();
      }
    };
    backdrop.querySelector('#ownerPinConfirm').addEventListener('click', confirmOwner);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmOwner(); });
    setTimeout(()=>input.focus(), 50);
  }

        const tr = el(`
          <tr>
            <td class="mono" style="font-size:12px; color:var(--muted);">${date}</td>
            <td>${m ? escapeHtml(m.name) : '<em>gelöscht</em>'}</td>
            <td>Bestellung ${tallyIcon(itemCount)}</td>
            <td style="font-size:12.5px; color:var(--muted); max-width:220px;">${detail}</td>
            <td class="num balance pos">${fmt(t.total)}</td>
          </tr>
        `);
        tbody.appendChild(tr);
      } else {
        const methodLabel = {bar:'Bar', ueberweisung:'Überweisung', sepa:'SEPA'}[t.method] || t.method;
        const tr = el(`
          <tr>
            <td class="mono" style="font-size:12px; color:var(--muted);">${date}</td>
            <td>${m ? escapeHtml(m.name) : '<em>gelöscht</em>'}</td>
            <td>Zahlung (${methodLabel})</td>
            <td style="font-size:12.5px; color:var(--muted);">${escapeHtml(t.note||'')}</td>
            <td class="num balance neg">−${fmt(t.amount)}</td>
          </tr>
        `);
        tbody.appendChild(tr);
      }
    });
    card.appendChild(table);
    wrap.appendChild(card);
    return wrap;
  }

  loadAll();
})();
</script>
</body>
</html>

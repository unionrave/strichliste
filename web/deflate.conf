# Gzip-Kompression für alle textbasierten Antworten. Wirkt sich vor allem auf
# index.html aus (rund 750 KB durch eingebettete Schriften/Bibliothek) und auf
# die JSON-Antworten von api.php - macht sich besonders bei langsamer
# Internetverbindung im Vereinsheim bemerkbar.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/xml text/xml

    # Bereits komprimierte Formate (Bilder, Schriften) nicht nochmal komprimieren -
    # bringt nichts und kostet nur unnötig Rechenzeit.
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|woff2?|zip|gz)$ no-gzip

    DeflateCompressionLevel 6
</IfModule>

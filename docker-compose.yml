version: "3.8"

services:
  db:
    image: mariadb:11
    container_name: tresen-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Passt den Pfad ggf. an euer Unraid-Share an (appdata ist Standard)
      - /mnt/user/appdata/tresen/db:/var/lib/mysql

  web:
    build: ./web
    container_name: tresen-web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # links: Port auf dem Unraid-Host, rechts: Port im Container (nicht ändern)
      - "8090:80"
    volumes:
      - ./app:/var/www/html

  # Erstellt täglich automatisch einen komprimierten Datenbank-Dump und
  # entfernt Backups, die älter als 30 Tage sind. Läuft dauerhaft im
  # Hintergrund, kein Cron auf dem Host nötig.
  db-backup:
    image: mariadb:11
    container_name: tresen-db-backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      RETENTION_DAYS: "30"
    volumes:
      # Eigener Ordner außerhalb des DB-Datenverzeichnisses - bewusst getrennt,
      # damit ein Problem mit dem DB-Volume nicht auch die Backups betrifft.
      - /mnt/user/appdata/tresen/backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

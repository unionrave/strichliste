# Ein Stack pro Verein. Start (im Repo-Ordner):
#   docker compose -p tresen-<verein> --env-file clubs/<verein>/.env up -d --build
# Alle vereinsspezifischen Werte (Port, Datenordner, DB-Passwörter) stehen in
# clubs/<verein>/.env, Name/Farben/Logo in clubs/<verein>/branding.json + logo.png.
services:
  db:
    image: mariadb:11
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${DATA_DIR}/db:/var/lib/mysql

  web:
    build: ./web
    container_name: ${COMPOSE_PROJECT_NAME}-web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # links: Port auf dem Unraid-Host (je Verein verschieden), rechts: Container-Port
      - "${WEB_PORT}:80"
    volumes:
      - ./index.html:/var/www/html/index.html:ro
      - ./api.php:/var/www/html/api.php:ro
      - ./config.php:/var/www/html/config.php:ro
      # Vereinsspezifisch: branding.json + logo.png
      - ./clubs/${CLUB}:/var/www/html/branding:ro

  # Täglicher komprimierter Datenbank-Dump, Backups älter als 30 Tage werden entfernt.
  db-backup:
    image: mariadb:11
    container_name: ${COMPOSE_PROJECT_NAME}-db-backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      RETENTION_DAYS: "30"
    volumes:
      # Getrennt vom DB-Datenordner, damit ein DB-Problem nicht auch die Backups trifft.
      - ${DATA_DIR}/backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
